apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-microservice
  labels:
    app: pricing-microservice
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pricing-microservice
  template:
    metadata:
      labels:
        app: pricing-microservice
    spec:
      containers:
      - name: pricing-microservice
        image: docker.io/myusername/pricing-microservice:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
